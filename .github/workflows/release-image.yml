# Publishes the relaychief-control image. It does not deploy anything.
name: Release image

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Immutable OCI tag to publish (for example, 0.1.0).
        required: true
        type: string
      source_sha:
        description: Exact 40-character commit SHA selected for this dispatch.
        required: true
        type: string
      confirmation:
        description: Type "publish-relaychief-control" to authorize registry publication.
        required: true
        type: string

permissions:
  contents: read

# One publication at a time, which closes the race between checking that a tag
# is absent and publishing it.
concurrency:
  group: release-relaychief-control-image
  cancel-in-progress: false

jobs:
  validate:
    name: Validate immutable release request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      image: ${{ steps.identity.outputs.image }}
      release_tag: ${{ steps.identity.outputs.release_tag }}
      sha_tag: ${{ steps.identity.outputs.sha_tag }}
      source_sha: ${{ steps.identity.outputs.source_sha }}
    steps:
      - name: Validate dispatch identity
        id: identity
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          DISPATCH_SHA: ${{ github.sha }}
          DISPATCH_REF: ${{ github.ref }}
          OWNER: ${{ github.repository_owner }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          [[ "$DISPATCH_REF" == "refs/heads/main" ]] || { echo "::error::Release dispatches must select the main branch."; exit 1; }
          [[ "$CONFIRMATION" == "publish-relaychief-control" ]] || { echo "::error::confirmation must be exactly publish-relaychief-control"; exit 1; }
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]] || { echo "::error::source_sha must be 40 lowercase hexadecimal characters."; exit 1; }
          [[ "$SOURCE_SHA" == "$DISPATCH_SHA" ]] || { echo "::error::source_sha must equal the commit selected for this dispatch ($DISPATCH_SHA)."; exit 1; }
          [[ "$RELEASE_TAG" =~ ^[a-z0-9][a-z0-9._-]{0,127}$ ]] || { echo "::error::release_tag must be a lowercase OCI tag of at most 128 characters."; exit 1; }
          case "$RELEASE_TAG" in
            latest|main|stable|edge|sha-*) echo "::error::release_tag must be a unique release identifier, not a moving or reserved tag."; exit 1 ;;
          esac
          {
            echo "image=ghcr.io/${OWNER,,}/relaychief-control"
            echo "release_tag=$RELEASE_TAG"
            echo "sha_tag=sha-$SOURCE_SHA"
            echo "source_sha=$SOURCE_SHA"
          } >> "$GITHUB_OUTPUT"

  publish:
    name: Build and publish multi-arch image
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: relaychief-control-release
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
          persist-credentials: false
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Refuse existing tags
        shell: bash
        env:
          IMAGE: ${{ needs.validate.outputs.image }}
          RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
          SHA_TAG: ${{ needs.validate.outputs.sha_tag }}
        run: |
          set -euo pipefail
          for tag in "$RELEASE_TAG" "$SHA_TAG"; do
            output_file="$RUNNER_TEMP/imagetools-$tag.txt"
            if docker buildx imagetools inspect "$IMAGE:$tag" >"$output_file" 2>&1; then
              echo "::error::$IMAGE:$tag already exists; published tags are never overwritten."
              exit 1
            fi
            if ! grep -Eqi 'manifest unknown|name unknown|not found' "$output_file"; then
              cat "$output_file" >&2
              echo "::error::Could not prove $IMAGE:$tag is absent; failing closed."
              exit 1
            fi
          done
      - name: Build and publish
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ needs.validate.outputs.image }}:${{ needs.validate.outputs.release_tag }}
            ${{ needs.validate.outputs.image }}:${{ needs.validate.outputs.sha_tag }}
          build-args: |
            IMAGE_REVISION=${{ needs.validate.outputs.source_sha }}
            IMAGE_VERSION=${{ needs.validate.outputs.release_tag }}
          provenance: mode=max
          sbom: true
      - name: Verify and report immutable digest
        shell: bash
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ needs.validate.outputs.image }}
          RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
          SHA_TAG: ${{ needs.validate.outputs.sha_tag }}
          SOURCE_SHA: ${{ needs.validate.outputs.source_sha }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]] || { echo "::error::Build did not return a valid OCI digest."; exit 1; }
          for tag in "$RELEASE_TAG" "$SHA_TAG"; do
            resolved="$(docker buildx imagetools inspect "$IMAGE:$tag" --format '{{json .Manifest.Digest}}' | tr -d '"')"
            [[ "$resolved" == "$DIGEST" ]] || { echo "::error::$IMAGE:$tag resolved to $resolved, expected $DIGEST."; exit 1; }
          done
          {
            echo "### relaychief-control image released"
            echo
            echo "Image: \`$IMAGE@$DIGEST\`"
            echo "Source commit: \`$SOURCE_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"
